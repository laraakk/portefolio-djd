<body>
    <h1>Exercício 6</h1>
    <script>
        let equipa = [{ nome: "Aria", classe: "Arqueira", hp: 80 }, { nome: "Bruno", classe: "Guerreiro", hp: 120 }, { nome: "Cleo", classe: "Maga", hp: 60 }];
        console.log("Heróis: ", equipa.length);
        console.log("Segundo: ", equipa[1].nome + " (" + equipa[1].classe + ")");
        equipa[2].hp = equipa[2].hp - 25;
        console.log("HP da Cleo:", equipa[2].hp);
        equipa.push({ nome: "Dino", classe: "Curandeiro", hp: 70 });
        console.log("Heróis: ", equipa.length);
        console.log("Último: ", equipa[equipa.length - 1].nome);
    </script>
