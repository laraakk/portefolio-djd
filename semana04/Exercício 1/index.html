<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
</head>
<body>
    <h1>Exercício 1</h1>
    <script>
        let inimigos = ["Goblin", "Orc", "Troll", "Dragão"];
        console.log("Primeiro: ", inimigos[0]); // "Goblin"
        console.log("Último: ", inimigos[inimigos.length - 1]); // "Dragão"
        console.log("Total: ", inimigos.length); // 4
        inimigos[1] = "Esqueleto";
        console.log("Segundo: ", inimigos[1]); // "Esqueleto"
        console.log("Posição 10: ", inimigos[10]); // Não existe
    </script>
</body>
</html>
