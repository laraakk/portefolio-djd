<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Painel de Personagem — DJD</title>
  <link rel="stylesheet" href="PainelPersonagem.css">
</head>
<body>
  <h1>🧙 Painel de Personagem</h1>

  <div class="painel">
    <p id="hp-display">HP: 100</p>
    <p id="estado-display">Estado: Pronto para combate</p>
    <p id="tecla-display">Última tecla: —</p>

    <div class="botoes">
      <button id="btn-atacar">⚔️ Atacar</button>
      <button id="btn-curar">💊 Curar</button>
    </div>
  </div>

  <p class="dica">Teclado: A = Atacar · C = Curar</p>

  <script src="PainelPersonagem.js"></script>
</body>
</html>
